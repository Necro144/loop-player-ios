name: Build IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen ffmpeg

      - name: Song card picture track (a 10 s black video, made here)
        run: ffmpeg -loglevel error -y -f lavfi -i color=c=black:s=320x320:r=10 -t 10 -c:v libx264 -pix_fmt yuv420p -profile:v baseline -movflags +faststart LoopPlayer/Resources/clip-blank.mp4

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project LoopPlayer.xcodeproj -scheme LoopPlayer \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | head -n 100; tail -n 40 build.log; exit 1; }
          grep -E "warning: .*LoopPlayer/" build.log | sort -u | head -n 60 || true
          tail -n 3 build.log

      - name: Package the IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LoopPlayer.app Payload/
          zip -qr LoopPlayer.ipa Payload
          ls -l *.ipa

      - name: Package the TIPA for TrollStore
        run: |
          # Same app, fake-signed with entitlements that TrollStore keeps: no sandbox, so the
          # app can open iCloud Drive and On My iPhone folders itself, without the system picker.
          brew install ldid > /dev/null
          rm -rf tipa-build && mkdir -p tipa-build/Payload
          cp -R build/Build/Products/Release-iphoneos/LoopPlayer.app tipa-build/Payload/
          ldid -Stipa/entitlements.plist tipa-build/Payload/LoopPlayer.app/LoopPlayer
          ldid -e tipa-build/Payload/LoopPlayer.app/LoopPlayer
          (cd tipa-build && zip -qr ../LoopPlayer.tipa Payload)
          ls -l LoopPlayer.tipa

      - uses: actions/upload-artifact@v4
        with:
          name: LoopPlayer-ipa
          path: |
            LoopPlayer.ipa
            LoopPlayer.tipa

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LoopPlayer.ipa
            LoopPlayer.tipa
          body_path: release-notes/${{ github.ref_name }}.md
          name: Loop Player ${{ github.ref_name }}
