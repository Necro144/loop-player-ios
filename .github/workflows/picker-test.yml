name: Folder picker test on iOS 16.4

on:
  # Run by hand (Actions tab > Run workflow) or by pushing a picker-* / test-* branch,
  # so private-repo Mac minutes are not spent on every push.
  push:
    branches: ['picker-*', 'test-*']
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Tools and test songs
        run: |
          brew install xcodegen ffmpeg > /dev/null
          xcodegen generate
          bash test/make_media.sh media

      - name: Install an iOS 16.4 simulator runtime
        run: |
          xcodebuild -downloadPlatform iOS -buildVersion 16.4 2>&1 | tail -n 5 || echo "download failed"
          xcrun simctl list runtimes

      - name: Create the simulator
        run: |
          RT=$(xcrun simctl list runtimes | grep -m1 "iOS 16.4" | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | head -1)
          echo "Runtime: $RT"
          test -n "$RT"
          UDID=$(xcrun simctl create "iPhone 14 picker" com.apple.CoreSimulator.SimDeviceType.iPhone-14 "$RT")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b | tail -n 3

      - name: Warm up and put Suno Songs in On My iPhone
        run: |
          # Opening the Files app once creates its On My iPhone storage and warms the simulator up.
          xcrun simctl launch "$UDID" com.apple.DocumentsApp || true
          sleep 25
          xcrun simctl terminate "$UDID" com.apple.DocumentsApp || true
          BASE=~/Library/Developer/CoreSimulator/Devices/$UDID/data/Containers/Shared/AppGroup
          STORE=$(find "$BASE" -maxdepth 2 -type d -name "File Provider Storage" | head -1)
          echo "On My iPhone storage: $STORE"
          if [ -n "$STORE" ]; then
            mkdir -p "$STORE/Suno Songs"
            cp -R media/. "$STORE/Suno Songs/"
            # The Files picker only shows what the system has indexed: restart the
            # simulator so On My iPhone is read again, then open Files once more.
            xcrun simctl shutdown "$UDID"
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b | tail -n 2
            xcrun simctl launch "$UDID" com.apple.DocumentsApp || true
            sleep 20
            xcrun simctl terminate "$UDID" com.apple.DocumentsApp || true
            find "$STORE" -maxdepth 3 | head -20
            echo "OUTSIDE_READY=1" >> "$GITHUB_ENV"
          else
            find "$BASE" -maxdepth 3 | head -40
            echo "OUTSIDE_READY=0" >> "$GITHUB_ENV"
          fi

      - name: Pick the folder with the real Files picker, tap Open, play
        run: |
          mkdir -p shots
          for attempt in 1 2; do
            TEST_RUNNER_SEED_DIR="$GITHUB_WORKSPACE/media" TEST_RUNNER_SHOTS_DIR="$GITHUB_WORKSPACE/shots"             TEST_RUNNER_OUTSIDE_READY="$OUTSIDE_READY"             xcodebuild test -project LoopPlayer.xcodeproj -scheme LoopPlayer               -destination "id=$UDID" -derivedDataPath uibuild -resultBundlePath "result$attempt.xcresult"               CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="-"               > test.log 2>&1; STATUS=$?
            grep -E "error:|Test Case|skipped|XCTAssert|failed:|Testing failed|never began|TEST (SUCCEEDED|FAILED)" test.log | cut -c1-300 | head -n 60
            if [ $STATUS -eq 0 ]; then break; fi
            if ! grep -q "never began executing" test.log; then break; fi
            echo "Test runner did not start; trying once more"
          done
          ls shots
          test "$OUTSIDE_READY" = "1" || { echo "On My iPhone storage was not found"; exit 1; }
          exit $STATUS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: picker-test-results
          path: |
            shots
            test.log
