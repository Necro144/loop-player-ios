name: Simulator test on iOS 16.4

on:
  # Run by hand (Actions tab > Run workflow) or by pushing a simtest-* branch,
  # so private-repo Mac minutes are not spent on every push.
  push:
    branches: ['simtest-*']
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build for the simulator
        run: |
          brew install xcodegen ffmpeg > /dev/null
          xcodegen generate
          xcodebuild -project LoopPlayer.xcodeproj -scheme LoopPlayer \
            -configuration Debug -sdk iphonesimulator -derivedDataPath simbuild \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | head -n 100; tail -n 40 build.log; exit 1; }
          tail -n 3 build.log

      - name: Make test songs and a video
        run: bash test/make_media.sh media

      - name: Install an iOS 16.4 simulator runtime
        run: |
          xcodebuild -downloadPlatform iOS -buildVersion 16.4 2>&1 | tail -n 5 || echo "download failed"
          xcrun simctl list runtimes

      - name: Boot the simulator and install the app
        run: |
          RT=$(xcrun simctl list runtimes | grep -m1 "iOS 16.4" | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | head -1)
          if [ -z "$RT" ]; then RT=$(xcrun simctl list runtimes | grep -m1 "iOS " | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | head -1); fi
          echo "Runtime: $RT"
          UDID=$(xcrun simctl create "iPhone 14 test" com.apple.CoreSimulator.SimDeviceType.iPhone-14 "$RT")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b | tail -n 3
          xcrun simctl install "$UDID" simbuild/Build/Products/Debug-iphonesimulator/LoopPlayer.app
          DOCS="$(xcrun simctl get_app_container "$UDID" com.necro144.loopplayer data)/Documents"
          mkdir -p "$DOCS"
          cp -R media/. "$DOCS/"
          find "$DOCS" -type f
          mkdir -p shots out

      - name: Scan, play and loop
        run: |
          shoot () { xcrun simctl io "$UDID" screenshot "shots/$1.png"; }
          launch () {
            xcrun simctl terminate "$UDID" com.necro144.loopplayer || true
            sleep 1
            env SIMCTL_CHILD_TEST_ADD_DOCUMENTS=1 "$@" xcrun simctl launch "$UDID" com.necro144.loopplayer
          }
          # 0. warm-up: the very first launch on a fresh simulator can take a long time
          launch SIMCTL_CHILD_TEST_TAB=0
          sleep 25
          # 1. add the Documents folder, scan it, play from the top and loop the song
          launch SIMCTL_CHILD_TEST_ADD_DOCUMENTS=1 SIMCTL_CHILD_TEST_PLAY=1 SIMCTL_CHILD_TEST_REPEAT_ONE=1 \
                 SIMCTL_CHILD_TEST_TAB=0 SIMCTL_CHILD_TEST_OUT="$GITHUB_WORKSPACE/out/play.txt"
          sleep 4;  shoot 1-home
          for i in $(seq 1 30); do [ -f out/play.txt ] && break; sleep 2; done
          shoot 2-home-playing
          echo "===== play report"; cat out/play.txt || echo "no report"
          # 2. full-screen player
          launch SIMCTL_CHILD_TEST_PLAY=1 SIMCTL_CHILD_TEST_PLAY_VIDEO=0 SIMCTL_CHILD_TEST_FULL=1 SIMCTL_CHILD_TEST_TAB=0
          sleep 6;  shoot 3-full-player
          # 3. video in the full player
          launch SIMCTL_CHILD_TEST_PLAY=1 SIMCTL_CHILD_TEST_PLAY_VIDEO=1 SIMCTL_CHILD_TEST_FULL=1 \
                 SIMCTL_CHILD_TEST_OUT="$GITHUB_WORKSPACE/out/video.txt"
          sleep 6;  shoot 4-video-player
          for i in $(seq 1 30); do [ -f out/video.txt ] && break; sleep 2; done
          echo "===== video report"; cat out/video.txt || echo "no report"
          # 4. the other tabs (the library comes back from the cache)
          launch SIMCTL_CHILD_TEST_TAB=1; sleep 4; shoot 5-library
          launch SIMCTL_CHILD_TEST_TAB=3; sleep 4; shoot 6-playlists
          launch SIMCTL_CHILD_TEST_TAB=5; sleep 4; shoot 7-settings
          ls -l shots

      - name: Video pictures, background play, YouTube, Spotify and Suno
        run: |
          shoot () { xcrun simctl io "$UDID" screenshot "shots/$1.png"; }
          launch () {
            xcrun simctl terminate "$UDID" com.necro144.loopplayer || true
            sleep 1
            env SIMCTL_CHILD_TEST_ADD_DOCUMENTS=1 "$@" xcrun simctl launch "$UDID" com.necro144.loopplayer
          }
          waitfor () { for i in $(seq 1 45); do [ -f "$1" ] && break; sleep 2; done; echo "===== $1"; cat "$1" || echo "no report"; }
          # 5. pictures for the videos (made after the scan), shown in Search
          launch SIMCTL_CHILD_TEST_TAB=2 SIMCTL_CHILD_TEST_PLAY=1 SIMCTL_CHILD_TEST_PLAY_TITLE="Second Song"                  SIMCTL_CHILD_TEST_OUT_WAIT=30 SIMCTL_CHILD_TEST_OUT="$GITHUB_WORKSPACE/out/thumbs.txt"
          waitfor out/thumbs.txt
          xcrun simctl terminate "$UDID" com.necro144.loopplayer || true; sleep 1
          env SIMCTL_CHILD_TEST_TAB=0 xcrun simctl launch "$UDID" com.necro144.loopplayer; sleep 6; shoot 8-home-with-video-pictures
          # 6. a video song keeps playing after going to another app; lock screen info is set
          launch SIMCTL_CHILD_TEST_PLAY=1 SIMCTL_CHILD_TEST_PLAY_TITLE="Long Song Video" SIMCTL_CHILD_TEST_FULL=1                  SIMCTL_CHILD_TEST_BG_WAIT=45 SIMCTL_CHILD_TEST_BG_OUT="$GITHUB_WORKSPACE/out/bg.txt"
          sleep 14; shoot 9-video-playing
          xcrun simctl launch "$UDID" com.apple.Preferences
          sleep 6; shoot 10-in-another-app
          waitfor out/bg.txt
          # 7. YouTube playlist, then one video on a loop
          launch SIMCTL_CHILD_TEST_TAB=3 SIMCTL_CHILD_TEST_YT="https://www.youtube.com/playlist?list=UUBR8-60-B28hp2BmDPdntcQ"                  SIMCTL_CHILD_TEST_YT_PLAY=1 SIMCTL_CHILD_TEST_YT_OUT="$GITHUB_WORKSPACE/out/yt.txt"
          sleep 30; shoot 11-youtube-playlist
          waitfor out/yt.txt
          launch SIMCTL_CHILD_TEST_TAB=3 SIMCTL_CHILD_TEST_YT="https://youtu.be/bkSNwyl7iHE"                  SIMCTL_CHILD_TEST_YT_PLAY=1 SIMCTL_CHILD_TEST_YT_OUT="$GITHUB_WORKSPACE/out/yt1.txt"
          sleep 30; shoot 12-youtube-video
          waitfor out/yt1.txt
          # 8. Spotify playlist import
          launch SIMCTL_CHILD_TEST_TAB=3 SIMCTL_CHILD_TEST_SPOTIFY="https://open.spotify.com/playlist/37i9dQZF1DXcBWIGoYBM5M"                  SIMCTL_CHILD_TEST_SP_OUT="$GITHUB_WORKSPACE/out/sp.txt"
          waitfor out/sp.txt
          sleep 2; shoot 13-playlists-tab
          # 9. Suno: stream a public song, go to another app, keep playing; then a playlist
          launch SIMCTL_CHILD_TEST_TAB=0 SIMCTL_CHILD_TEST_SUNO="https://suno.com/song/538ab4ae-3ace-4abf-95f9-be0bed53b65d"                  SIMCTL_CHILD_TEST_SUNO_WAIT=40 SIMCTL_CHILD_TEST_SUNO_OUT="$GITHUB_WORKSPACE/out/suno.txt"
          sleep 14; shoot 14-suno-playing
          xcrun simctl launch "$UDID" com.apple.Preferences
          waitfor out/suno.txt
          launch SIMCTL_CHILD_TEST_TAB=3 SIMCTL_CHILD_TEST_SUNO="https://suno.com/playlist/990fd5fe-70d2-449b-8a4d-3cb0a7d3e805"                  SIMCTL_CHILD_TEST_SUNO_WAIT=15 SIMCTL_CHILD_TEST_SUNO_OUT="$GITHUB_WORKSPACE/out/suno-list.txt"
          waitfor out/suno-list.txt
          sleep 2; shoot 15-suno-playlists
          launch SIMCTL_CHILD_TEST_SUNO_SIGNIN=1
          sleep 20; shoot 16-suno-sign-in

      - name: Check the results
        run: |
          fail=0
          check () { if grep -qE "$1" "$2"; then echo "ok   $3"; else echo "FAIL $3"; fail=1; fi; }
          check "^playing=true$" out/bg.txt "video keeps playing in the background"
          check "^background=true$" out/bg.txt "app really was in the background"
          check "^bgPauses=0$" out/bg.txt "no stop-and-start when leaving the app"
          check "^nowPlayingTitle=Long Song Video$" out/bg.txt "lock screen info set"
          check "^nowPlayingArtwork=true$" out/bg.txt "lock screen artwork set"
          check "^songs=1$" out/suno.txt "Suno song link read"
          check "^playing=true$" out/suno.txt "Suno song streams (also in the background)"
          check "^time=([2-9][0-9]|[1-9][0-9][0-9])$" out/suno.txt "Suno song played 20 s or more"
          check "^nowPlayingTitle=Porch Light On$" out/suno.txt "Suno song on the lock screen"
          check "^songs=[1-9]" out/suno-list.txt "Suno playlist read"
          check "^playing=true$" out/suno-list.txt "Suno playlist plays"
          check "track: Clip Video .*video=true \| art=true" out/thumbs.txt "picture for Clip Video"
          check "track: Long Song Video .*video=true \| art=true" out/thumbs.txt "picture for Long Song Video"
          check "^videos=[1-9]" out/yt.txt "YouTube playlist list loaded"
          grep -q "event: state s=1" out/yt.txt && echo "ok   YouTube playlist plays" || echo "note YouTube playlist plays: not on this server (YouTube asks GitHub machines to sign in)"
          check "^single=true$" out/yt1.txt "YouTube single video added"
          grep -q "event: state s=1" out/yt1.txt && echo "ok   YouTube single video plays" || echo "note YouTube single video plays: not on this server (YouTube asks GitHub machines to sign in)"
          check "^tracks=[1-9]" out/sp.txt "Spotify track list imported"
          T=$(grep "^time=" out/bg.txt | cut -d= -f2); if [ "${T:-0}" -ge 35 ]; then echo "ok   background time $T s"; else echo "FAIL background time ${T:-?} s"; fail=1; fi
          cat out/play.txt
          grep -q "^tracks=6$" out/play.txt
          grep -q "^videos=2$" out/play.txt
          grep -q "^playing=true$" out/play.txt
          grep -q "^repeat=2$" out/play.txt
          grep -q "track: Night Drive | Necro | CI Album" out/play.txt
          grep -q "track: Lost Signal | Necro |" out/play.txt
          grep -q "^playing=true$" out/video.txt
          T=$(grep "^time=" out/play.txt | cut -d= -f2); test "$T" -ge 2
          exit $fail

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-results
          path: |
            shots
            out
