name: Simulator test on iOS 16.4

on:
  # Run by hand (Actions tab > Run workflow) or by pushing a simtest-* branch,
  # so private-repo Mac minutes are not spent on every push.
  push:
    branches: ['simtest-*']
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build for the simulator
        run: |
          brew install xcodegen ffmpeg > /dev/null
          xcodegen generate
          xcodebuild -project LoopPlayer.xcodeproj -scheme LoopPlayer \
            -configuration Debug -sdk iphonesimulator -derivedDataPath simbuild \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | head -n 100; tail -n 40 build.log; exit 1; }
          tail -n 3 build.log

      - name: Make test songs and a video
        run: bash test/make_media.sh media

      - name: Install an iOS 16.4 simulator runtime
        run: |
          xcodebuild -downloadPlatform iOS -buildVersion 16.4 2>&1 | tail -n 5 || echo "download failed"
          xcrun simctl list runtimes

      - name: Boot the simulator and install the app
        run: |
          RT=$(xcrun simctl list runtimes | grep -m1 "iOS 16.4" | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | head -1)
          if [ -z "$RT" ]; then RT=$(xcrun simctl list runtimes | grep -m1 "iOS " | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | head -1); fi
          echo "Runtime: $RT"
          UDID=$(xcrun simctl create "iPhone 14 test" com.apple.CoreSimulator.SimDeviceType.iPhone-14 "$RT")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b | tail -n 3
          xcrun simctl install "$UDID" simbuild/Build/Products/Debug-iphonesimulator/LoopPlayer.app
          DOCS="$(xcrun simctl get_app_container "$UDID" com.necro144.loopplayer data)/Documents"
          mkdir -p "$DOCS"
          cp -R media/. "$DOCS/"
          find "$DOCS" -type f
          mkdir -p shots out

      - name: Scan, play and loop
        run: |
          shoot () { xcrun simctl io "$UDID" screenshot "shots/$1.png"; }
          launch () {
            xcrun simctl terminate "$UDID" com.necro144.loopplayer || true
            sleep 1
            env SIMCTL_CHILD_TEST_ADD_DOCUMENTS=1 "$@" xcrun simctl launch "$UDID" com.necro144.loopplayer
          }
          # 0. warm-up: the very first launch on a fresh simulator can take a long time
          launch SIMCTL_CHILD_TEST_TAB=0
          sleep 25
          # 1. add the Documents folder, scan it, play from the top and loop the song
          launch SIMCTL_CHILD_TEST_ADD_DOCUMENTS=1 SIMCTL_CHILD_TEST_PLAY=1 SIMCTL_CHILD_TEST_REPEAT_ONE=1 \
                 SIMCTL_CHILD_TEST_TAB=0 SIMCTL_CHILD_TEST_OUT="$GITHUB_WORKSPACE/out/play.txt"
          sleep 4;  shoot 1-home
          for i in $(seq 1 30); do [ -f out/play.txt ] && break; sleep 2; done
          shoot 2-home-playing
          echo "===== play report"; cat out/play.txt || echo "no report"
          # 2. full-screen player
          launch SIMCTL_CHILD_TEST_PLAY=1 SIMCTL_CHILD_TEST_PLAY_VIDEO=0 SIMCTL_CHILD_TEST_FULL=1 SIMCTL_CHILD_TEST_TAB=0
          sleep 6;  shoot 3-full-player
          # 3. video in the full player
          launch SIMCTL_CHILD_TEST_PLAY=1 SIMCTL_CHILD_TEST_PLAY_VIDEO=1 SIMCTL_CHILD_TEST_FULL=1 \
                 SIMCTL_CHILD_TEST_OUT="$GITHUB_WORKSPACE/out/video.txt"
          sleep 6;  shoot 4-video-player
          for i in $(seq 1 30); do [ -f out/video.txt ] && break; sleep 2; done
          echo "===== video report"; cat out/video.txt || echo "no report"
          # 4. the other tabs (the library comes back from the cache)
          launch SIMCTL_CHILD_TEST_TAB=1; sleep 4; shoot 5-library
          launch SIMCTL_CHILD_TEST_TAB=3; sleep 4; shoot 6-playlists
          launch SIMCTL_CHILD_TEST_TAB=5; sleep 4; shoot 7-settings
          ls -l shots

      - name: Video pictures, background play, YouTube, Spotify and Suno
        run: |
          shoot () { xcrun simctl io "$UDID" screenshot "shots/$1.png"; }
          launch () {
            xcrun simctl terminate "$UDID" com.necro144.loopplayer || true
            sleep 1
            env SIMCTL_CHILD_TEST_ADD_DOCUMENTS=1 "$@" xcrun simctl launch "$UDID" com.necro144.loopplayer
          }
          waitfor () { for i in $(seq 1 45); do [ -f "$1" ] && break; sleep 2; done; echo "===== $1"; cat "$1" || echo "no report"; }
          # 5. pictures for the videos (made after the scan), shown in Search
          launch SIMCTL_CHILD_TEST_TAB=2 SIMCTL_CHILD_TEST_PLAY=1 SIMCTL_CHILD_TEST_PLAY_TITLE="Second Song"                  SIMCTL_CHILD_TEST_OUT_WAIT=30 SIMCTL_CHILD_TEST_OUT="$GITHUB_WORKSPACE/out/thumbs.txt"
          waitfor out/thumbs.txt
          xcrun simctl terminate "$UDID" com.necro144.loopplayer || true; sleep 1
          env SIMCTL_CHILD_TEST_TAB=0 xcrun simctl launch "$UDID" com.necro144.loopplayer; sleep 6; shoot 8-home-with-video-pictures
          # 6. a video song keeps playing after going to another app; lock screen info is set
          launch SIMCTL_CHILD_TEST_PLAY=1 SIMCTL_CHILD_TEST_PLAY_TITLE="Long Song Video" SIMCTL_CHILD_TEST_FULL=1                  SIMCTL_CHILD_TEST_BG_WAIT=45 SIMCTL_CHILD_TEST_BG_OUT="$GITHUB_WORKSPACE/out/bg.txt"
          sleep 14; shoot 9-video-playing
          xcrun simctl launch "$UDID" com.apple.Preferences
          sleep 6; shoot 10-in-another-app
          waitfor out/bg.txt
          # 7. YouTube playlist, then one video on a loop
          launch SIMCTL_CHILD_TEST_TAB=3 SIMCTL_CHILD_TEST_YT="https://www.youtube.com/playlist?list=UUBR8-60-B28hp2BmDPdntcQ"                  SIMCTL_CHILD_TEST_YT_PLAY=1 SIMCTL_CHILD_TEST_YT_OUT="$GITHUB_WORKSPACE/out/yt.txt"
          sleep 30; shoot 11-youtube-playlist
          waitfor out/yt.txt
          launch SIMCTL_CHILD_TEST_TAB=3 SIMCTL_CHILD_TEST_YT="https://youtu.be/bkSNwyl7iHE"                  SIMCTL_CHILD_TEST_YT_PLAY=1 SIMCTL_CHILD_TEST_YT_OUT="$GITHUB_WORKSPACE/out/yt1.txt"
          sleep 30; shoot 12-youtube-video
          waitfor out/yt1.txt
          # 8. Spotify playlist import
          launch SIMCTL_CHILD_TEST_TAB=3 SIMCTL_CHILD_TEST_SPOTIFY="https://open.spotify.com/playlist/37i9dQZF1DXcBWIGoYBM5M"                  SIMCTL_CHILD_TEST_SP_OUT="$GITHUB_WORKSPACE/out/sp.txt"
          waitfor out/sp.txt
          sleep 2; shoot 13-playlists-tab
          # 8b. Share a Clip: 10 s and 1 minute from the playing video, then the share sheet
          launch SIMCTL_CHILD_TEST_PLAY=1 SIMCTL_CHILD_TEST_PLAY_TITLE="Long Song Video" SIMCTL_CHILD_TEST_FULL=1                  SIMCTL_CHILD_TEST_CLIP=10 SIMCTL_CHILD_TEST_CLIP_OUT="$GITHUB_WORKSPACE/out/clip10.txt"
          waitfor out/clip10.txt
          sleep 3; shoot 13b-clip-share-sheet
          launch SIMCTL_CHILD_TEST_PLAY=1 SIMCTL_CHILD_TEST_PLAY_TITLE="Long Song Video" SIMCTL_CHILD_TEST_FULL=1                  SIMCTL_CHILD_TEST_CLIP=60 SIMCTL_CHILD_TEST_CLIP_OUT="$GITHUB_WORKSPACE/out/clip60.txt"
          waitfor out/clip60.txt
          # 8c. a slowed clip: 0.8x with the pitch following the speed, still 10 s long (8 s of video)
          launch SIMCTL_CHILD_TEST_PLAY=1 SIMCTL_CHILD_TEST_PLAY_TITLE="Long Song Video" SIMCTL_CHILD_TEST_FULL=1                  SIMCTL_CHILD_TEST_RATE=0.8 SIMCTL_CHILD_TEST_KEEP_PITCH=0 SIMCTL_CHILD_TEST_CLIP=10 SIMCTL_CHILD_TEST_CLIP_OUT="$GITHUB_WORKSPACE/out/clipslow.txt"
          waitfor out/clipslow.txt
          # 8d. Clip Studio: Story 9:16 with a look, caption, title, stamp and fades; a 2x loop in
          # Cinematic; a song card for a song; a photo in Portrait 4:5; the Clip Studio screen
          launch SIMCTL_CHILD_TEST_PLAY=1 SIMCTL_CHILD_TEST_PLAY_TITLE="Long Song Video" SIMCTL_CHILD_TEST_FULL=1 SIMCTL_CHILD_TEST_CLIP=6 SIMCTL_CHILD_TEST_CLIP_SIZE=story SIMCTL_CHILD_TEST_CLIP_LOOK=vivid SIMCTL_CHILD_TEST_CLIP_CAPTION="Loop it" SIMCTL_CHILD_TEST_CLIP_TITLE=1 SIMCTL_CHILD_TEST_CLIP_STAMP=1 SIMCTL_CHILD_TEST_CLIP_FADE=1 SIMCTL_CHILD_TEST_CLIP_OUT="$GITHUB_WORKSPACE/out/clipstory.txt"
          waitfor out/clipstory.txt
          sleep 2; shoot 13c-story-clip
          launch SIMCTL_CHILD_TEST_PLAY=1 SIMCTL_CHILD_TEST_PLAY_TITLE="Long Song Video" SIMCTL_CHILD_TEST_FULL=1 SIMCTL_CHILD_TEST_CLIP=8 SIMCTL_CHILD_TEST_CLIP_REPEAT=2 SIMCTL_CHILD_TEST_CLIP_SIZE=cinematic SIMCTL_CHILD_TEST_CLIP_LOOK=mono SIMCTL_CHILD_TEST_CLIP_OUT="$GITHUB_WORKSPACE/out/cliploop.txt"
          waitfor out/cliploop.txt
          launch SIMCTL_CHILD_TEST_PLAY=1 SIMCTL_CHILD_TEST_PLAY_VIDEO=0 SIMCTL_CHILD_TEST_FULL=1 SIMCTL_CHILD_TEST_CLIP=6 SIMCTL_CHILD_TEST_CLIP_SIZE=square SIMCTL_CHILD_TEST_CLIP_CARD=vinyl SIMCTL_CHILD_TEST_CLIP_CAPTION="Night" SIMCTL_CHILD_TEST_CLIP_CAPTION_COLOR=yellow SIMCTL_CHILD_TEST_CLIP_OUT="$GITHUB_WORKSPACE/out/clipcard.txt"
          waitfor out/clipcard.txt
          launch SIMCTL_CHILD_TEST_PLAY=1 SIMCTL_CHILD_TEST_PLAY_VIDEO=0 SIMCTL_CHILD_TEST_FULL=1 SIMCTL_CHILD_TEST_CLIP=40 SIMCTL_CHILD_TEST_CLIP_SIZE=story SIMCTL_CHILD_TEST_CLIP_OUT="$GITHUB_WORKSPACE/out/clipcard40.txt"
          sleep 60; waitfor out/clipcard40.txt
          sleep 2; shoot 13d-song-card-clip
          launch SIMCTL_CHILD_TEST_PLAY=1 SIMCTL_CHILD_TEST_PLAY_TITLE="Long Song Video" SIMCTL_CHILD_TEST_FULL=1 SIMCTL_CHILD_TEST_CLIP=5 SIMCTL_CHILD_TEST_CLIP_PHOTO=1 SIMCTL_CHILD_TEST_CLIP_SIZE=portrait SIMCTL_CHILD_TEST_CLIP_LOOK=warm SIMCTL_CHILD_TEST_CLIP_CAPTION="Hi" SIMCTL_CHILD_TEST_CLIP_OUT="$GITHUB_WORKSPACE/out/clipphoto.txt"
          waitfor out/clipphoto.txt
          launch SIMCTL_CHILD_TEST_PLAY=1 SIMCTL_CHILD_TEST_PLAY_TITLE="Long Song Video" SIMCTL_CHILD_TEST_STUDIO=1 SIMCTL_CHILD_TEST_STUDIO_OUT="$GITHUB_WORKSPACE/out/studio.txt"
          sleep 14; shoot 13e-clip-studio
          waitfor out/studio.txt
          xcrun simctl io "$UDID" screenshot shots/13f-clip-studio-again.png || true
          xcrun simctl openurl "$UDID" "loopplayer://studio" || true
          sleep 5; shoot 13g-studio-from-link
          # 8e (1.5.4). Painting without Core Image: every look, shape and song card style; a phone
          # video stored sideways (must come out upright, 360x640); 8-bit and Dream looks on video.
          launch SIMCTL_CHILD_TEST_TAB=0 SIMCTL_CHILD_TEST_PAINT_OUT="$GITHUB_WORKSPACE/out/paint.txt"
          waitfor out/paint.txt
          TMPD="$(xcrun simctl get_app_container "$UDID" com.necro144.loopplayer data)/tmp"
          mkdir -p "$TMPD"
          ffmpeg -loglevel error -y -display_rotation 90 -i "media/clip.mp4" -c copy "$TMPD/turned.mp4" \
            || ffmpeg -loglevel error -y -i "media/clip.mp4" -c copy -metadata:s:v:0 rotate=90 "$TMPD/turned.mp4"
          ffprobe -v error -show_streams -select_streams v "$TMPD/turned.mp4" | grep -iE "width|height|rotat" || true
          launch SIMCTL_CHILD_TEST_PLAY=1 SIMCTL_CHILD_TEST_PLAY_TITLE="Long Song Video" SIMCTL_CHILD_TEST_FULL=1 SIMCTL_CHILD_TEST_CLIP=5 SIMCTL_CHILD_TEST_CLIP_VIDEO="$TMPD/turned.mp4" SIMCTL_CHILD_TEST_CLIP_LOOK=noir SIMCTL_CHILD_TEST_CLIP_CAPTION="Up" SIMCTL_CHILD_TEST_CLIP_OUT="$GITHUB_WORKSPACE/out/clipturned.txt"
          waitfor out/clipturned.txt
          launch SIMCTL_CHILD_TEST_PLAY=1 SIMCTL_CHILD_TEST_PLAY_TITLE="Long Song Video" SIMCTL_CHILD_TEST_FULL=1 SIMCTL_CHILD_TEST_CLIP=5 SIMCTL_CHILD_TEST_CLIP_SIZE=square SIMCTL_CHILD_TEST_CLIP_LOOK=pixel SIMCTL_CHILD_TEST_CLIP_OUT="$GITHUB_WORKSPACE/out/clippixel.txt"
          waitfor out/clippixel.txt
          launch SIMCTL_CHILD_TEST_PLAY=1 SIMCTL_CHILD_TEST_PLAY_TITLE="Long Song Video" SIMCTL_CHILD_TEST_FULL=1 SIMCTL_CHILD_TEST_CLIP=5 SIMCTL_CHILD_TEST_CLIP_SIZE=youtube SIMCTL_CHILD_TEST_CLIP_LOOK=dream SIMCTL_CHILD_TEST_CLIP_OUT="$GITHUB_WORKSPACE/out/clipdream.txt"
          waitfor out/clipdream.txt
          # 8f (1.5.4). Send to Snapchat screen, and every tab in the Light, Dark and System themes
          launch SIMCTL_CHILD_TEST_TAB=0 SIMCTL_CHILD_TEST_SNAP_SEND=1
          sleep 7; shoot 13h-send-to-snapchat
          for th in light dark; do
            for t in 0 1 2 3 5; do
              launch SIMCTL_CHILD_TEST_TAB=$t SIMCTL_CHILD_TEST_THEME=$th SIMCTL_CHILD_TEST_ACCENT=blue; sleep 5; shoot "13t-$th-tab$t"
            done
          done
          launch SIMCTL_CHILD_TEST_PLAY=1 SIMCTL_CHILD_TEST_PLAY_TITLE="Long Song Video" SIMCTL_CHILD_TEST_STUDIO=1 SIMCTL_CHILD_TEST_THEME=light SIMCTL_CHILD_TEST_ACCENT=green
          sleep 14; shoot 13u-studio-light
          launch SIMCTL_CHILD_TEST_TAB=0 SIMCTL_CHILD_TEST_SNAP_SEND=1 SIMCTL_CHILD_TEST_THEME=light
          sleep 7; shoot 13v-snap-light
          launch SIMCTL_CHILD_TEST_TAB=5 SIMCTL_CHILD_TEST_THEME=black SIMCTL_CHILD_TEST_ACCENT=pink
          sleep 5; shoot 13w-settings-black
          # 9. Suno: stream a public song, go to another app, keep playing; then a playlist
          launch SIMCTL_CHILD_TEST_TAB=0 SIMCTL_CHILD_TEST_SUNO="https://suno.com/song/538ab4ae-3ace-4abf-95f9-be0bed53b65d"                  SIMCTL_CHILD_TEST_SUNO_WAIT=40 SIMCTL_CHILD_TEST_SUNO_OUT="$GITHUB_WORKSPACE/out/suno.txt"
          sleep 14; shoot 14-suno-playing
          xcrun simctl launch "$UDID" com.apple.Preferences
          waitfor out/suno.txt
          launch SIMCTL_CHILD_TEST_TAB=3 SIMCTL_CHILD_TEST_SUNO="https://suno.com/playlist/990fd5fe-70d2-449b-8a4d-3cb0a7d3e805"                  SIMCTL_CHILD_TEST_SUNO_WAIT=15 SIMCTL_CHILD_TEST_SUNO_OUT="$GITHUB_WORKSPACE/out/suno-list.txt"
          waitfor out/suno-list.txt
          sleep 2; shoot 15-suno-playlists
          launch SIMCTL_CHILD_TEST_SUNO_SIGNIN=1
          sleep 20; shoot 16-suno-sign-in

      - name: Check the results
        run: |
          fail=0
          check () { if grep -qE "$1" "$2"; then echo "ok   $3"; else echo "FAIL $3"; fail=1; fi; }
          check "^playing=true$" out/bg.txt "video keeps playing in the background"
          check "^background=true$" out/bg.txt "app really was in the background"
          check "^bgPauses=0$" out/bg.txt "no stop-and-start when leaving the app"
          check "^nowPlayingTitle=Long Song Video$" out/bg.txt "lock screen info set"
          check "^nowPlayingArtwork=true$" out/bg.txt "lock screen artwork set"
          check "^songs=1$" out/suno.txt "Suno song link read"
          check "^playing=true$" out/suno.txt "Suno song streams (also in the background)"
          check "^time=([2-9][0-9]|[1-9][0-9][0-9])$" out/suno.txt "Suno song played 20 s or more"
          check "^nowPlayingTitle=Porch Light On$" out/suno.txt "Suno song on the lock screen"
          check "^songs=[1-9]" out/suno-list.txt "Suno playlist read"
          check "^playing=true$" out/suno-list.txt "Suno playlist plays"
          check "track: Clip Video .*video=true \| art=true" out/thumbs.txt "picture for Clip Video"
          check "track: Long Song Video .*video=true \| art=true" out/thumbs.txt "picture for Long Song Video"
          check "^videos=[1-9]" out/yt.txt "YouTube playlist list loaded"
          grep -q "event: state s=1" out/yt.txt && echo "ok   YouTube playlist plays" || echo "note YouTube playlist plays: not on this server (YouTube asks GitHub machines to sign in)"
          check "^single=true$" out/yt1.txt "YouTube single video added"
          grep -q "event: state s=1" out/yt1.txt && echo "ok   YouTube single video plays" || echo "note YouTube single video plays: not on this server (YouTube asks GitHub machines to sign in)"
          check "^tracks=[1-9]" out/sp.txt "Spotify track list imported"
          check "^seconds=(9\.[5-9]|10\.[0-5])$" out/clip10.txt "10 second clip made"
          check "^seconds=(59\.[5-9]|60\.[0-5])$" out/clip60.txt "1 minute clip made"
          check "^video=640x360$" out/clip10.txt "clip has the picture"
          check "^audio=true$" out/clip10.txt "clip has the sound"
          check "^seconds=(9\.[5-9]|10\.[0-5])$" out/clipslow.txt "slowed clip is 10 s (made from 8 s at 0.8x)"
          check "^audio=true$" out/clipslow.txt "slowed clip has the sound"
          check "^video=1080x1920$" out/clipstory.txt "Story clip is 1080x1920"
          check "^seconds=(5\.[5-9]|6\.[0-5])$" out/clipstory.txt "Story clip is 6 s"
          check "^audio=true$" out/clipstory.txt "Story clip has the sound"
          check "^video=1920x804$" out/cliploop.txt "Cinematic clip is 1920x804"
          check "^seconds=(7\.[5-9]|8\.[0-5])$" out/cliploop.txt "2x loop clip is 8 s"
          check "^video=1080x1080$" out/clipcard.txt "song card (vinyl) is 1080x1080"
          check "^brightness=0\.([1-9]|0[5-9])" out/clipcard.txt "song card has a picture (not black)"
          check "^video=1080x1920$" out/clipcard40.txt "40 s song card in Story size"
          check "^audio=true$" out/clipcard40.txt "40 s song card has the sound"
          check "^audio=true$" out/clipcard.txt "song card has the sound"
          check "^seconds=(5\.[5-9]|6\.[0-5])$" out/clipcard.txt "song card is 6 s"
          check "^video=1536x1920$" out/clipphoto.txt "photo made in Portrait 4:5"
          check "^brightness=0\.([1-9]|0[5-9])" out/clipstory.txt "Story clip has a picture (not black)"
          check "^brightness=0\.([1-9]|0[5-9])" out/cliploop.txt "Cinematic clip has a picture (not black)"
          check "^brightness=0\.([1-9]|0[5-9])" out/clipphoto.txt "photo has a picture (not black)"
          check "^brightness=0\.([1-9]|0[5-9])" out/studio.txt "Clip Studio preview is not black"
          check "^look mono: r=([0-9]+) g=\1 b=\1$" out/paint.txt "Mono look makes grey (colour matrix channels right)"
          check "^look warm: r=2[45][0-9] g=0 b=0$" out/paint.txt "Warm look keeps red red"
          check "^paint check took" out/paint.txt "every look, shape and song card painted"
          if grep -q "failed" out/paint.txt; then echo "FAIL some paint checks failed"; fail=1; fi
          check "^video=360x640$" out/clipturned.txt "sideways phone video comes out upright"
          check "^brightness=0\.([1-9]|0[5-9])" out/clipturned.txt "upright clip has a picture"
          check "^video=1080x1080$" out/clippixel.txt "8-bit look clip in Square"
          check "^brightness=0\.([1-9]|0[5-9])" out/clippixel.txt "8-bit clip has a picture"
          check "^video=1920x1080$" out/clipdream.txt "Dream look clip in YouTube 16:9"
          check "^brightness=0\.([1-9]|0[5-9])" out/clipdream.txt "Dream clip has a picture"
          cat out/paint.txt
          T=$(grep "^time=" out/bg.txt | cut -d= -f2); if [ "${T:-0}" -ge 35 ]; then echo "ok   background time $T s"; else echo "FAIL background time ${T:-?} s"; fail=1; fi
          cat out/play.txt
          grep -q "^tracks=6$" out/play.txt
          grep -q "^videos=2$" out/play.txt
          grep -q "^playing=true$" out/play.txt
          grep -q "^repeat=2$" out/play.txt
          grep -q "track: Night Drive | Necro | CI Album" out/play.txt
          grep -q "track: Lost Signal | Necro |" out/play.txt
          grep -q "^playing=true$" out/video.txt
          T=$(grep "^time=" out/play.txt | cut -d= -f2); test "$T" -ge 2
          exit $fail

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-results
          path: |
            shots
            out
