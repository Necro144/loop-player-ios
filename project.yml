name: LoopPlayer
options:
  bundleIdPrefix: com.necro144
  deploymentTarget:
    iOS: "16.0"
targets:
  LoopPlayer:
    type: application
    platform: iOS
    sources:
      - LoopPlayer
    scheme:
      testTargets:
        - LoopPlayerUITests
    info:
      path: LoopPlayer/Info.plist
      properties:
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.necro144.loopplayer
        PRODUCT_NAME: LoopPlayer
        MARKETING_VERSION: "1.2.2"
        CURRENT_PROJECT_VERSION: "9"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Loop Player
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
  LoopPlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - LoopPlayerUITests
    dependencies:
      - target: LoopPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.necro144.loopplayer.uitests
        TEST_TARGET_NAME: LoopPlayer
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
